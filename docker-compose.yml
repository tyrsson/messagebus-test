services:
    mysql:
        build: docker/database/mysql
        ports:
            - 3306:3306
        environment:
            - MYSQL_DATABASE=${MYSQL_DB:-messagebus_event_test}
            - MYSQL_USER=${MYSQL_USER:-messagebus_event_test}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD:-messagebus_event_test}
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
            interval: 30s
            timeout: 60s
            retries: 5
            start_period: 80s

    phpmyadmin:
        image: phpmyadmin:latest
        ports:
            - 8082:80
        environment:
            - PMA_HOST=mysql
            - PMA_USER=root
            - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
        depends_on:
            mysql:
                condition: service_healthy

volumes:
    mysql_data:
        name: messagebus_event_test_mysql_data